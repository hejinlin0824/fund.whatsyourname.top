<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Whatsyour · 基金看板{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <style>
    :root{--ink:#1f2937;--line:#e5e7eb;--accent:#4f46e5;}
    body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:var(--ink);font-size:.95rem;}
    .navbar{background:#1f2937;border-bottom:1px solid #000;}
    .navbar-brand{flex-direction:column;line-height:1.05;padding:.15rem 0;}
    .brand-wordmark{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:1.4rem;letter-spacing:-.02em;color:#a5b4fc;}
    .brand-tag{font-size:.58rem;color:rgba(255,255,255,.4);letter-spacing:.3em;text-transform:uppercase;}
    .nav-link{color:rgba(255,255,255,.7)!important;font-weight:500;padding:.4rem .7rem!important;border-radius:6px;}
    .nav-link:hover{color:#fff!important;background:rgba(255,255,255,.1);}
    .navbar-text{color:rgba(255,255,255,.5);font-weight:500;}
    .panel{border:1px solid var(--line);border-radius:8px;background:#fff;padding:1rem 1.1rem;}
    .stat .label{color:#94a3b8;font-size:.76rem;font-weight:600;letter-spacing:.02em;margin-bottom:.1rem;}
    .stat .value{font-family:"Space Grotesk";font-weight:700;font-size:clamp(1.02rem,2.4vw,1.3rem);white-space:nowrap;line-height:1.2;}
    .pos{color:#dc2626;} .neg{color:#059669;} .muted{color:#94a3b8;}
    .section-title{font-weight:700;font-size:1.05rem;margin-bottom:0;}
    .btn{border-radius:6px;font-weight:500;}
    input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=search],select,textarea{
      border:1px solid var(--line);border-radius:6px;padding:.42rem .55rem;font-size:.9rem;width:100%;background:#fff;}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,70,229,.15);}
    table{font-size:.9rem;}
    th{font-weight:600;color:#64748b;}
    /* 日历：背景随当日盈亏红绿 */
    .cal td{height:74px;padding:0;vertical-align:top;border:1px solid var(--line);}
    .cal a{display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:.25rem .3rem;text-decoration:none;color:inherit;}
    .cal .d{font-weight:600;font-size:.82rem;color:#475569;}
    .cal .p{font-family:"Space Grotesk";font-weight:700;font-size:.76rem;}
    .cal-up{background:#fee2e2;} .cal-up .p{color:#991b1b;}
    .cal-down{background:#dcfce7;} .cal-down .p{color:#065f46;}
    .cal-zero{background:#fff;}
    .cal-pending{background:#fffbeb;}
    .cal-future .d{color:#cbd5e1;}
    .cal td.today{outline:2px solid var(--accent);outline-offset:-2px;}
  </style>
</head>
<body>
  <nav class="navbar navbar-expand sticky-top mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'dashboard' %}">
        <span class="brand-wordmark">Whatsyour</span>
        <span class="brand-tag">Fund Dashboard</span>
      </a>
      <ul class="navbar-nav ms-auto align-items-center gap-1">
        <li><a class="nav-link" href="{% url 'dashboard' %}">首页</a></li>
        <li><a class="nav-link" href="{% url 'fund-list' %}">基金</a></li>
        <li><a class="nav-link" href="{% url 'daily-entry' %}">录入</a></li>
        <li><a class="nav-link" href="{% url 'calendar' %}">日历</a></li>
        <li><a class="nav-link" href="{% url 'portfolio' %}">组合</a></li>
        <li><a class="nav-link" href="{% url 'news-list' %}">新闻</a></li>
        <li><a class="nav-link" href="/aiagent/">AI报告</a></li>
        {% if user.is_authenticated %}
          <li class="navbar-text ms-2 me-1">{{ user.username }}</li>
          <li>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
              {% csrf_token %}<button type="submit" class="btn btn-sm btn-outline-light">登出</button>
            </form>
          </li>
        {% else %}
          <li><a class="btn btn-sm btn-light fw-semibold ms-2" href="{% url 'login' %}">登录</a></li>
        {% endif %}
      </ul>
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
