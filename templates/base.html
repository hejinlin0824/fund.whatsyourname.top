<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}基金看板{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-sm navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'dashboard' %}">📈 基金看板</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'fund-list' %}">基金</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'daily-entry' %}">今日录入</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'calendar' %}">日历</a></li>
        </ul>
        {% if user.is_authenticated %}
          <span class="navbar-text text-light me-3">{{ user.username }}</span>
          <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">登出</a>
        {% else %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">登录</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
