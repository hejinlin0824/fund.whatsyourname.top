<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Whatsyour · 基金看板{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body { font-family: system-ui,"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f6fa; color:#1f2937; }
    .navbar { background:linear-gradient(135deg,#1e1b4b,#4c1d95 60%,#831843)!important; box-shadow:0 4px 18px rgba(30,27,75,.25); }
    .navbar-brand { flex-direction:column; line-height:1.05; padding:.1rem 0; }
    .brand-wordmark { font-family:"Space Grotesk",system-ui; font-weight:700; font-size:1.55rem; letter-spacing:-.02em;
      background:linear-gradient(90deg,#a5b4fc,#f0abfc); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .brand-tag { font-size:.6rem; color:rgba(255,255,255,.45); letter-spacing:.32em; text-transform:uppercase; }
    .nav-link { color:rgba(255,255,255,.72)!important; font-weight:500; border-radius:.5rem; padding:.45rem .85rem!important; }
    .nav-link:hover, .nav-link.active { color:#fff!important; background:rgba(255,255,255,.12); }
    .navbar-text { color:rgba(255,255,255,.55); font-weight:500; }
    .card { border:1px solid #eef0f4; border-radius:1rem; box-shadow:0 1px 3px rgba(16,24,40,.05); }
    .card-pad { padding:1.1rem 1.25rem; }
    .stat .label { color:#94a3b8; font-size:.78rem; font-weight:600; letter-spacing:.02em; margin-bottom:.15rem; }
    .stat .value { font-family:"Space Grotesk"; font-weight:700; font-size:1.5rem; }
    .pos { color:#dc2626; } .neg { color:#059669; } .muted { color:#94a3b8; }
    .section-title { font-weight:700; font-size:1.05rem; }
    .btn { border-radius:.55rem; font-weight:500; }
    .btn-link { text-decoration:none; }
    /* 日历 */
    .cal td { height:78px; padding:0; vertical-align:top; }
    .cal a { display:flex; flex-direction:column; justify-content:space-between; height:100%; padding:.3rem .35rem; text-decoration:none; border-radius:.5rem; }
    .cal .d { font-weight:600; font-size:.85rem; }
    .cal .p { font-family:"Space Grotesk"; font-weight:700; font-size:.78rem; }
    .cal-future .d { color:#cbd5e1; }
    .cal-filled { background:#ecfdf5; } .cal-filled .d{color:#065f46;}
    .cal-pending { background:#fffbeb; } .cal-pending .d{color:#92400e;}
    .cal-rest { background:#f1f5f9; } .cal-rest .d{color:#64748b;}
    .cal-empty { background:#fff; } .cal-empty .d{color:#cbd5e1;}
    .cal .today { outline:2px solid #6366f1; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand sticky-top mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'dashboard' %}">
        <span class="brand-wordmark">Whatsyour</span>
        <span class="brand-tag">Fund Dashboard</span>
      </a>
      <ul class="navbar-nav ms-auto align-items-center gap-1">
        <li><a class="nav-link" href="{% url 'dashboard' %}">首页</a></li>
        <li><a class="nav-link" href="{% url 'fund-list' %}">基金</a></li>
        <li><a class="nav-link" href="{% url 'daily-entry' %}">今日录入</a></li>
        <li><a class="nav-link" href="{% url 'calendar' %}">日历</a></li>
        <li><a class="nav-link" href="{% url 'portfolio' %}">组合</a></li>
        {% if user.is_authenticated %}
          <li class="navbar-text ms-2 me-1">{{ user.username }}</li>
          <li><a class="btn btn-sm btn-outline-light" href="{% url 'logout' %}">登出</a></li>
        {% else %}
          <li><a class="btn btn-sm btn-light fw-semibold ms-2" href="{% url 'login' %}">登录</a></li>
        {% endif %}
      </ul>
    </div>
  </nav>
  <div class="container py-2 pb-5">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
