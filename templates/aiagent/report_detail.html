{% extends "base.html" %}
{% block content %}
<a href="{% url 'aiagent:report-list' %}">← 返回列表</a>
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
  <h1 class="mb-0">{{ report.get_type_display }}报告 · {{ report.date }}
    <span class="badge bg-{% if report.status == 'ok' %}success{% elif report.status == 'degraded' %}warning{% else %}danger{% endif %}">{{ report.get_status_display }}</span>
  </h1>
  <form method="post" action="{% url 'aiagent:report-delete' report.id %}"
        onsubmit="return confirm('删除这份报告？');" class="m-0">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i> 删除</button>
  </form>
</div>
<div class="panel mt-2">{{ report.content_html|safe }}</div>
{% endblock %}
