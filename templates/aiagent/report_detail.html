{% extends "base.html" %}
{% block title %}AI 报告 · Whatsyour{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
  <div>
    <a href="{% url 'aiagent:report-list' %}" class="muted" style="font-size:.8rem;text-decoration:none">← 返回列表</a>
    <h4 class="section-title mt-1 mb-0">{{ report.get_type_display }}报告 · {{ report.date }}
      <span class="badge bg-{% if report.status == 'ok' %}success{% elif report.status == 'degraded' %}warning{% else %}danger{% endif %}">{{ report.get_status_display }}</span>
    </h4>
  </div>
  <form method="post" action="{% url 'aiagent:report-delete' report.id %}" onsubmit="return confirm('删除这份报告？');" class="m-0">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i> 删除</button>
  </form>
</div>
{{ report.content_html|safe }}
{% endblock %}
