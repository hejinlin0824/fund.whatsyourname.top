{% extends "base.html" %}
{% block title %}登录 · Whatsyour{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
  <h4 class="section-title mb-3">登录</h4>
  <div class="panel">
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="text-danger mb-2" style="font-size:.85rem">{{ form.non_field_errors }}</div>{% endif %}
      <div class="mb-2">
        <label class="form-label small text-muted">用户名</label>
        {{ form.username }}
      </div>
      <div class="mb-3">
        <label class="form-label small text-muted">密码</label>
        {{ form.password }}
      </div>
      <button type="submit" class="btn btn-primary w-100">登录</button>
    </form>
  </div>
  <p class="mt-3 text-muted small">没有账号？<a href="{% url 'register' %}">去注册</a></p>
</div></div>
{% endblock %}
